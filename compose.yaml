services:
  browser-agent:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - browser-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
volumes:
  browser-data:
